<div class="space-y-3">
  <div class="flex items-center justify-between px-1">
    <h2 class="text-lg sm:text-xl font-semibold">
      {{ carousel.title }}
    </h2>
  </div>

  <div class="relative">

    <!-- LEFT ARROW -->
    <button
      id="carousel-left-{{ carousel.id }}"
      type="button"
      data-carousel-id="{{ carousel.id }}"
      class="absolute left-0 top-1/2 -translate-y-1/2 z-10
             flex h-9 w-9 items-center justify-center rounded-full
             bg-zinc-900/80 text-white text-lg
             hover:bg-zinc-800/90
             disabled:bg-zinc-800/50 disabled:text-zinc-500
             disabled:hover:bg-zinc-800/50 disabled:cursor-default"
      onclick="scrollCarousel('{{ carousel.id }}', -1, event)">
      ‹  <!-- actual arrow -->
    </button>

    <!-- SCROLLER -->
    <div
      id="carousel-{{ carousel.id }}"
      data-carousel-id="{{ carousel.id }}"
      class="carousel-scroller flex gap-4 overflow-x-auto pb-2 pt-1
             scroll-smooth snap-x snap-mandatory hide-scrollbar"
    >
      {% for tile in carousel.tiles %}
        <div class="snap-start shrink-0 w-40 sm:w-44 md:w-52">
          {{ tile|render_tile }}
        </div>
      {% endfor %}
    </div>

    <!-- RIGHT ARROW -->
    <button
      id="carousel-right-{{ carousel.id }}"
      type="button"
      data-carousel-id="{{ carousel.id }}"
      class="absolute right-0 top-1/2 -translate-y-1/2 z-10
             flex h-9 w-9 items-center justify-center rounded-full
             bg-zinc-900/80 text-white text-lg
             hover:bg-zinc-800/90
             disabled:bg-zinc-800/50 disabled:text-zinc-500
             disabled:hover:bg-zinc-800/50 disabled:cursor-default"
      onclick="scrollCarousel('{{ carousel.id }}', 1, event)"
    >
      ›  <!-- actual arrow -->
    </button>
  </div>
</div>
