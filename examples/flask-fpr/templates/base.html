<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title or "Streaming Demo" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Nice scrollbar for horizontal carousels */
      .scrollbar-thin::-webkit-scrollbar {
        height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.7);
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="h-full bg-zinc-950 text-zinc-100">
    <div class="min-h-screen flex flex-col">
      <!-- Top nav -->
      <header
        class="flex items-center justify-between px-8 py-4 bg-gradient-to-b from-zinc-900/90 to-zinc-950/0"
      >
        <div class="flex items-center gap-8">
          <div class="text-2xl font-black tracking-tight text-sky-400">
            {{ brand or "MyStream" }}
          </div>
          <nav class="hidden md:flex items-center gap-5 text-sm text-zinc-300">
            <a href="#" class="hover:text-white font-semibold">Home</a>
            <a href="#" class="hover:text-white">TV Shows</a>
            <a href="#" class="hover:text-white">Movies</a>
            <a href="#" class="hover:text-white">Sports</a>
            <a href="#" class="hover:text-white">My List</a>
          </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
          <button
            class="hidden sm:inline-flex items-center gap-2 rounded-full bg-zinc-900/80 px-3 py-1 text-zinc-300 hover:bg-zinc-800/80"
          >
            <span class="material-icons text-base">search</span>
            <span class="hidden md:inline">Search</span>
          </button>
          <div
            class="h-8 w-8 rounded-full bg-gradient-to-tr from-sky-500 to-violet-500 flex items-center justify-center text-xs font-bold"
          >
            JK
          </div>
        </div>
      </header>

      <!-- Main content -->
      <main class="flex-1 px-4 sm:px-8 pb-12">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
